name: flutter_app
description: "NFC-Based Car Parking Allocation System for ABC Mall"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # State Management
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3
  
  # Firebase
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_storage: ^13.0.4
  
  # NFC
  nfc_manager: ^3.3.0
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Authentication
  google_sign_in: ^7.2.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # For backward compatibility (if needed)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  #image 
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true